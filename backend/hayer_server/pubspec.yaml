name: hayer_server
description: Serverpod backend for Hayer.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  http: ^1.5.0
  passkeys_server: 1.0.0
  pointycastle: ^4.0.0
  serverpod: 3.4.13
  serverpod_auth_idp_server: 3.4.13
  timezone: ^0.10.1
  uuid: ^4.5.2
  watcher: ^1.1.3

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.13
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\..\app
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\backend\hayer_server\web\app
      posix: |
        cd ../../app
        flutter build web --base-href /app/ --wasm --output ../backend/hayer_server/web/app

    admin_build:
      posix: |
        cd ../../admin
        flutter build web --base-href / --wasm --output ../backend/hayer_server/web/admin
