class: HayerSessionRow
serverOnly: true
table: hayer_session
fields:
  id: UuidValue?, defaultPersist=random_v7
  sessionId: String
  code: String
  hostUserId: String
  mode: SessionMode
  categoryId: String
  subcategoryIds: List<String>
  priceLevel: int?
  anchorLatitude: double
  anchorLongitude: double
  anchorAddress: String?
  cityKey: String?
  cityName: String?
  visitAt: DateTime?
  countryCode: String
  radiusMeters: int
  deckSizeRequested: int
  deckSizeActual: int
  consensusRule: ConsensusRule
  matchingTiming: MatchingTiming
  status: SessionStatus
  matchedPlaceId: String?
  decisionAt: DateTime?
  revision: int
  freshnessWarning: String?
  intent: PlaceIntentQuery?
  intentBatchCount: int?, default=1
  createdAt: DateTime
  expiresAt: DateTime
indexes:
  hayer_session_session_id:
    fields: sessionId
    unique: true
  hayer_session_code:
    fields: code
    unique: true
  hayer_session_status_expires:
    fields: status, expiresAt
  hayer_session_created:
    fields: createdAt
