class: RefreshJobRow
serverOnly: true
table: hayer_refresh_job
fields:
  id: UuidValue?, defaultPersist=random_v7
  jobId: String
  coverageKey: String
  status: JobStatus
  requestedBy: String
  reason: String
  createdAt: DateTime
  startedAt: DateTime?
  completedAt: DateTime?
  errorCode: String?
  planJson: String?
  # A running job's worker renews this; recovery waits for it to go quiet.
  heartbeatAt: DateTime?
indexes:
  hayer_refresh_job_id:
    fields: jobId
    unique: true
  hayer_refresh_job_coverage_status:
    fields: coverageKey, status
  hayer_refresh_job_created:
    fields: createdAt
