class: CacheSettingsRow
serverOnly: true
table: hayer_cache_settings
fields:
  id: UuidValue?, defaultPersist=random_v7
  settingsKey: String
  version: int
  freshHours: int
  staleFallbackDays: int
  retentionDays: int
  extractorAttempts: int
  perCreationConcurrency: int
  globalRequestsPerMinute: int
  globalBurst: int
  routeEstimatesEnabled: bool, default=true
  allowParticipantLocation: bool, default=true
  defaultRouteOrigin: RouteOriginMode, default=sessionAnchor
  routeEstimateCacheMinutes: int, default=10
  routeRequestsPerMinute: int, default=30
  routeBurst: int, default=6
  updatedBy: String
  updatedAt: DateTime
indexes:
  hayer_cache_settings_key:
    fields: settingsKey
    unique: true
