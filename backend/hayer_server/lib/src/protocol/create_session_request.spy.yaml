class: CreateSessionRequest
fields:
  mode: SessionMode
  categoryId: String
  subcategoryIds: List<String>
  priceLevel: int?
  anchorLatitude: double
  anchorLongitude: double
  anchorAddress: String?
  visitAt: DateTime?
  radiusMeters: int
  deckSize: int
  displayName: String?
  consensusRule: ConsensusRule
  matchingTiming: MatchingTiming
  analyticsContext: ClientAnalyticsContext?
  shortlistPlaceIds: List<String>?
  freshDiscoveryCount: int?
  # Set only by the canonical intent endpoint. Legacy clients continue to use
  # categoryId/subcategoryIds without knowing this field exists.
  intent: PlaceIntentQuery?
