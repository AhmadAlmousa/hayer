class: BootstrapInfo
fields:
  minimumBuild: int
  latestBuild: int
  updateRequired: bool
  supportedCountries: List<String>
  certifiedCountries: List<String>
  taxonomyVersion: String
  configVersion: int
  serverTime: DateTime
  # How many photos a device should keep and for how long. Null from an older
  # server leaves the client on its built-in defaults; photos are shared by
  # both modes, so this is not behind the discovery flag.
  photos: PhotoPolicy?
