map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Only requests that passed Basic Auth on the enrollment API receive this marker.
# Setting these proxy headers at server scope overwrites spoofed client values
# on public API requests as well.
map $uri $hayer_admin_enrollment {
  default "";
  ~^/admin/enroll-api/ 1;
}

# Only same-origin browser RPCs may reach the protected admin endpoint. nginx
# overwrites the marker so a client cannot forge it through a request header.
map $http_origin $hayer_admin_origin_allowed {
  default 0;
  "https://hayer.almou.sa" 1;
}

server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Hayer-Admin-Enrollment $hayer_admin_enrollment;
  proxy_set_header X-Hayer-Admin-User $remote_user;
  proxy_set_header X-Hayer-Admin-Origin-Allowed $hayer_admin_origin_allowed;

  location /api/ {
    proxy_pass http://server:8080/;
  }

  location = /admin {
    return 308 /admin/;
  }

  # Preserve bookmarks and POST semantics from the previous admin mount.
  location ~ ^/admin/cache(?:/(.*))?$ {
    return 308 /admin/$1;
  }

  location /admin/api/ {
    proxy_pass http://server:8080/;
  }

  # Force a browser navigation through the recovery realm before the SPA calls
  # the enrollment endpoint. This keeps routine /admin access passwordless.
  location = /admin/enroll {
    auth_basic "Hayer passkey enrollment";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
    proxy_pass http://server:8082/admin/enroll;
  }

  location = /admin/enroll/ {
    auth_basic "Hayer passkey enrollment";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
    proxy_pass http://server:8082/admin/enroll;
  }

  # Break-glass bootstrap only. The returned token can register one passkey;
  # it does not carry dashboard privileges and is revoked after registration.
  location /admin/enroll-api/ {
    auth_basic "Hayer passkey enrollment";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
    proxy_pass http://server:8080/;
  }

  location /admin-api/ {
    return 404;
  }

  location /admin/ {
    proxy_pass http://server:8082/admin/;
  }

  location /insights/ {
    return 404;
  }

  location = /download {
    return 302 /downloads/hayer.apk;
  }

  location = /download/ {
    return 302 /downloads/hayer.apk;
  }

  # Preserve older clean shared links while accepting every digit used by the
  # current letter-plus-two-digits session code format.
  location ~ "^/join/([A-HJ-NP-Za-hj-np-z0-9]{3}|[A-HJ-NP-Za-hj-np-z0-9]{6})/?$" {
    # Serve the app shell without changing the public /join/{code} URL.
    # Its /app/ base href still resolves Flutter assets from the right place.
    rewrite ^ /app/index.html break;
    proxy_pass http://server:8082;
  }

  location / {
    proxy_pass http://server:8082/;
  }
}
