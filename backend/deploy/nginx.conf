map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Cloudflare Tunnel supplies CF-Connecting-IP. Private traffic has its client
# address restored only when it arrives through the trusted NPM host.
set_real_ip_from 192.168.225.21;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Only a single syntactically valid address is honored. An absent, list-valued,
# or malformed header falls back to the peer address, so a malformed value
# cannot mint a budget of its own. The server validates the value again.
map $http_cf_connecting_ip $hayer_public_client_ip {
  default $remote_addr;
  "~^[0-9]{1,3}(\.[0-9]{1,3}){3}$" $http_cf_connecting_ip;
  "~^[0-9A-Fa-f:]{2,45}$" $http_cf_connecting_ip;
}

map $uri $hayer_admin_enrollment {
  default "";
  ~^/enroll-api/ 1;
}

map $http_origin $hayer_admin_origin_allowed {
  default 0;
  "https://hayer.vpn.almou.sa" 1;
}

# Session RPCs all share the /api/hayerSession path, so a join-specific edge
# rule would throttle swiping too. Join stays budgeted in the application.
limit_req_zone $hayer_public_client_ip zone=hayer_public_api:10m rate=30r/s;
limit_req_zone $hayer_public_client_ip zone=hayer_public_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hayer_admin_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hayer_admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hayer_admin_enroll:10m rate=3r/m;
limit_conn_zone $hayer_public_client_ip zone=hayer_public_connections:10m;
limit_conn_zone $binary_remote_addr zone=hayer_admin_connections:10m;

# Unknown hosts expose neither the consumer nor the administration surface.
server {
  listen 8080 default_server;
  server_name _;

  location = /gateway-health {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}

# Public Cloudflare Tunnel host: consumer, downloads, join links, and API only.
server {
  listen 8080;
  server_name hayer.almou.sa;
  absolute_redirect off;
  client_max_body_size 1m;
  limit_req_status 429;
  limit_conn_status 429;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Hayer-Admin-Enrollment "";
  proxy_set_header X-Hayer-Admin-User "";
  proxy_set_header X-Hayer-Admin-Origin-Allowed 0;
  proxy_set_header X-Hayer-Client-Ip $hayer_public_client_ip;

  # Serverpod posts every RPC to the endpoint path and carries the method in
  # the body, so signups arrive at /api/anonymousIdp. A method-path match here
  # never fires and silently leaves signups on the generic /api/ budget.
  location ^~ /api/anonymousIdp {
    limit_req zone=hayer_public_login burst=5 nodelay;
    limit_conn hayer_public_connections 50;
    proxy_pass http://server:8080/anonymousIdp;
  }

  location = /api/websocket {
    limit_conn hayer_public_connections 50;
    proxy_pass http://server:8080/websocket;
  }

  location /api/ {
    limit_req zone=hayer_public_api burst=60 nodelay;
    limit_conn hayer_public_connections 50;
    proxy_pass http://server:8080/;
  }

  location = /admin {
    return 404;
  }

  location ^~ /admin/ {
    return 404;
  }

  location /admin-api/ {
    return 404;
  }

  location /insights/ {
    return 404;
  }

  location = /download {
    return 302 /downloads/hayer.apk;
  }

  location = /download/ {
    return 302 /downloads/hayer.apk;
  }

  # Keep the incoming discovery URL and query for Flutter's link codec.
  location = /discover {
    rewrite ^ /app/index.html break;
    proxy_pass http://server:8082;
  }

  location = /app/discover {
    rewrite ^ /app/index.html break;
    proxy_pass http://server:8082;
  }

  # Current links use ABC-124. Undashed and historical three/six-character
  # links remain routable during the forced build-5 transition.
  location ~ "^/join/([A-Za-z]{3}-?[0-9]{3}|[A-HJ-NP-Za-hj-np-z0-9]{3}|[A-HJ-NP-Za-hj-np-z0-9]{6})/?$" {
    rewrite ^ /app/index.html break;
    proxy_pass http://server:8082;
  }

  location / {
    proxy_pass http://server:8082/;
  }
}

# The dedicated private port also fails closed for an unexpected Host header.
server {
  listen 8081 default_server;
  server_name _;

  location / {
    return 404;
  }
}

# Private LAN/Tailscale listener: administration only. NPM maps the private
# hostname to host port 8433, keeping it isolated from Cloudflare's port 8432.
server {
  listen 8081;
  server_name hayer.vpn.almou.sa;
  absolute_redirect off;
  client_max_body_size 1m;
  limit_req_status 429;
  limit_conn_status 429;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Hayer-Admin-Enrollment $hayer_admin_enrollment;
  proxy_set_header X-Hayer-Admin-User $remote_user;
  proxy_set_header X-Hayer-Admin-Origin-Allowed $hayer_admin_origin_allowed;
  # real_ip has already restored the LAN client here, so private-side signups
  # are budgeted per operator rather than per gateway.
  proxy_set_header X-Hayer-Client-Ip $remote_addr;

  location = /admin {
    return 308 /;
  }

  location ~ ^/admin/cache(?:/(.*))?$ {
    return 308 /$1;
  }

  location ~ ^/admin/(.*)$ {
    return 308 /$1;
  }

  # Serverpod posts RPCs to the endpoint path without a trailing slash. An
  # exact match prevents nginx from canonicalizing the POST with a 301, which
  # browsers may follow as a GET and thereby discard the RPC body.
  location = /api/passkeyIdp {
    limit_req zone=hayer_admin_login burst=5 nodelay;
    limit_conn hayer_admin_connections 50;
    proxy_pass http://server:8080/passkeyIdp;
  }

  location /api/passkeyIdp/ {
    limit_req zone=hayer_admin_login burst=5 nodelay;
    limit_conn hayer_admin_connections 50;
    proxy_pass http://server:8080/passkeyIdp/;
  }

  location /api/ {
    limit_req zone=hayer_admin_api burst=60 nodelay;
    limit_conn hayer_admin_connections 50;
    proxy_pass http://server:8080/;
  }

  location = /enroll {
    include /etc/nginx/secrets/admin-enrollment-policy.conf;
    auth_basic "Hayer passkey enrollment";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
    proxy_pass http://server:8082/admin/enroll;
  }

  location = /enroll/ {
    include /etc/nginx/secrets/admin-enrollment-policy.conf;
    auth_basic "Hayer passkey enrollment";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
    proxy_pass http://server:8082/admin/enroll;
  }

  location /enroll-api/ {
    include /etc/nginx/secrets/admin-enrollment-policy.conf;
    limit_req zone=hayer_admin_enroll burst=3 nodelay;
    auth_basic "Hayer passkey enrollment";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
    proxy_pass http://server:8080/;
  }

  location / {
    proxy_pass http://server:8082/admin/;
  }
}
