map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Only requests that passed Basic Auth on the admin API receive this marker.
# Setting these proxy headers at server scope overwrites spoofed client values
# on public API requests as well.
map $uri $hayer_admin_authenticated {
  default "";
  ~^/admin/cache/api/ 1;
}

server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  client_max_body_size 1m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Hayer-Admin-Authenticated $hayer_admin_authenticated;
  proxy_set_header X-Hayer-Admin-User $remote_user;

  location /api/ {
    proxy_pass http://server:8080/;
  }

  location /admin/cache/api/ {
    auth_basic "Hayer operations";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
    proxy_pass http://server:8080/;
  }

  location /admin-api/ {
    return 404;
  }

  location /admin/cache/ {
    auth_basic "Hayer operations";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
    proxy_pass http://server:8082/admin/cache/;
  }

  location /insights/ {
    return 404;
  }

  location = /download {
    return 302 /downloads/hayer.apk;
  }

  location = /download/ {
    return 302 /downloads/hayer.apk;
  }

  # QR and shared links enter the Flutter web join flow. Native Android app
  # links can still intercept this public URL before it reaches nginx.
  location ~ "^/join/([A-HJ-NP-Za-hj-np-z2-9]{3}|[A-HJ-NP-Za-hj-np-z2-9]{6})/?$" {
    # Serve the app shell without changing the public /join/{code} URL.
    # Its /app/ base href still resolves Flutter assets from the right place.
    rewrite ^ /app/index.html break;
    proxy_pass http://server:8082;
  }

  location / {
    proxy_pass http://server:8082/;
  }
}
