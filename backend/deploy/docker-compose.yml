name: hayer

x-server-image: &server-image
  image: hayer-server:local
  pull_policy: never

services:
  runtime-init:
    <<: *server-image
    command:
      - /opt/hayer/bundles/runtime-init/bin/hayer-runtime-init
      - /run/hayer/server
      - /run/hayer/gateway
      - /run/hayer/public
    restart: "no"
    environment:
      HAYER_ADMIN_USER: "${HAYER_ADMIN_USER:-operator}"
      HAYER_ADMIN_PASSWORD: "${HAYER_ADMIN_PASSWORD:-}"
      HAYER_ADMIN_ENROLLMENT_ENABLED: "${HAYER_ADMIN_ENROLLMENT_ENABLED:-false}"
      HAYER_ANDROID_SHA256: "${HAYER_ANDROID_SHA256:-}"
    volumes:
      - server-secrets:/run/hayer/server
      - gateway-secrets:/run/hayer/gateway
      - public-config:/run/hayer/public
    networks: [hayer]

  gateway:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "192.168.225.20:8432:8080"
      - "192.168.225.20:8433:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - gateway-secrets:/etc/nginx/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [hayer]

  place-canary:
    <<: *server-image
    command: ["/opt/hayer/bundles/place-canary/bin/hayer-place-canary"]
    restart: "no"
    networks: [hayer]

  server:
    <<: *server-image
    command:
      - /bin/sh
      - -ec
      - |
        cp /run/hayer/server/passwords.yaml config/passwords.yaml
        cp /run/hayer/public/assetlinks.json web/static/.well-known/assetlinks.json
        exec /opt/hayer/bundles/server/bin/hayer-server --mode=production --server-id=default --logging=normal --role=monolith --apply-migrations
    restart: unless-stopped
    environment:
      HAYER_ADMIN_ENROLLMENT_ENABLED: "${HAYER_ADMIN_ENROLLMENT_ENABLED:-false}"
      HAYER_GEOCODER_ENDPOINT: "${HAYER_GEOCODER_ENDPOINT:-https://nominatim.openstreetmap.org/reverse}"
      # FlutterRoute's default no-caches only index.html, the bootstrap, the
      # service worker and the two manifests; main.dart.js/.wasm/.mjs get
      # public, max-age=86400. Those filenames are not content-hashed and the
      # service worker is now the self-unregistering stub, so nothing
      # invalidates them and a deploy stayed invisible for a day. ETag
      # revalidation still returns 304, so an unchanged bundle is not refetched.
      SERVERPOD_WEB_SERVER_FLUTTER_CACHE_CONTROL: "no-cache, private"
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - server-secrets:/run/hayer/server:ro
      - public-config:/run/hayer/public:ro
      - ./releases:/opt/hayer/web/static/downloads:ro
    expose: ["8080", "8081", "8082"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [hayer]

  public-gateway-canary:
    <<: *server-image
    restart: "no"
    command:
      - /opt/hayer/bundles/public-gateway-canary/bin/hayer-public-gateway-canary
      - ${HAYER_PUBLIC_API_URL:-https://hayer.almou.sa/api/}
    depends_on:
      gateway:
        condition: service_healthy
    networks: [hayer]

  postgres:
    image: ghcr.io/serverpod/postgres:16@sha256:5c606a4027d2c304d01faffd9db815abddc0e1ce7aea96eda28ad23a6f421ea8
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: hayer
      POSTGRES_USER: hayer
      POSTGRES_PASSWORD_FILE: /run/hayer/database_password
      TZ: Asia/Riyadh
    volumes:
      - server-secrets:/run/hayer:ro
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayer -d hayer"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [hayer]

  backup:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: hayer
      PGUSER: hayer
      PGPASSFILE: /tmp/hayer-pgpass
      TZ: Asia/Riyadh
    volumes:
      - server-secrets:/run/secrets:ro
      - ./backups:/backups
      - ./backup-loop.sh:/usr/local/bin/backup-loop:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop"]
    networks: [hayer]

networks:
  hayer:
    internal: false

volumes:
  server-secrets:
  gateway-secrets:
  public-config:
