name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Install matching Serverpod generator
        run: dart pub global activate serverpod_cli 3.4.13

      - name: Verify generated protocol is current
        working-directory: backend/hayer_server
        run: |
          serverpod generate
          git diff --exit-code -- lib/src/generated ../hayer_client/lib/src/protocol test/integration/test_tools

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          backend/hayer_server/lib backend/hayer_server/bin
          backend/hayer_server/tool backend/hayer_server/test
          backend/hayer_client/lib
          app/lib app/test admin/lib admin/test

      - name: Analyze server
        working-directory: backend/hayer_server
        run: dart analyze --fatal-infos

      - name: Test server domain and extractor
        working-directory: backend/hayer_server
        run: dart test

      - name: Check operational scripts
        run: |
          bash -n scripts/preflight.sh scripts/deploy-unraid.sh scripts/build-release-apk.sh
          sh -n backend/deploy/backup-loop.sh backend/deploy/restore-backup.sh

      - name: Analyze and test consumer
        working-directory: app
        run: flutter analyze --fatal-infos && flutter test

      - name: Analyze and test admin
        working-directory: admin
        run: flutter analyze --fatal-infos && flutter test

      - name: Build web clients
        run: |
          (cd app && flutter build web --base-href /app/)
          (cd admin && flutter build web --base-href /admin/cache/)

      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --dart-define=SERVER_URL=https://hayer.almou.sa/api/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hayer-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
