name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgis:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_DB: hayer_test
          POSTGRES_PASSWORD: hayer_test
          POSTGRES_USER: postgres
        ports:
          - 9090:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hayer_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Install matching Serverpod generator
        run: dart pub global activate serverpod_cli 3.4.13

      - name: Verify generated protocol is current
        working-directory: backend/hayer_server
        run: |
          serverpod generate
          git diff --exit-code -- lib/src/generated ../hayer_client/lib/src/protocol test/integration/test_tools

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          backend/hayer_server/lib backend/hayer_server/bin
          backend/hayer_server/tool backend/hayer_server/test
          backend/hayer_server/integration_test
          backend/hayer_client/lib
          app/lib app/test admin/lib admin/test

      - name: Analyze server
        working-directory: backend/hayer_server
        run: dart analyze --fatal-infos

      - name: Test server domain and extractor
        working-directory: backend/hayer_server
        run: dart test

      - name: Test server sessions with PostGIS
        working-directory: backend/hayer_server
        env:
          SERVERPOD_DATABASE_PASSWORD: hayer_test
        # The session suite disables Serverpod's rollback wrapper so it can
        # exercise concurrent transactions. Keep test files on one shared
        # PostGIS database sequential to prevent cross-suite schema/data races.
        run: dart test integration_test --concurrency=1

      - name: Check operational scripts
        run: |
          bash -n scripts/preflight.sh scripts/build-release-apk.sh scripts/test-server-integration.sh
          sh -n backend/deploy/backup-loop.sh backend/deploy/restore-backup.sh

      - name: Analyze and test consumer
        working-directory: app
        run: flutter analyze --fatal-infos && flutter test

      - name: Analyze and test admin
        working-directory: admin
        run: flutter analyze --fatal-infos && flutter test

      - name: Build web clients
        run: |
          (cd app && flutter build web --base-href /app/)
          (cd admin && flutter build web --base-href /admin/cache/)

      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --dart-define=SERVER_URL=https://hayer.almou.sa/api/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hayer-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
