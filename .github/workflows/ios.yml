name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Compile unsigned iOS app
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Compile iOS release app
        working-directory: app
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=SERVER_URL=https://hayer.almou.sa/api/

      - name: Package unsigned app
        working-directory: app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/ios/iphoneos/Runner.app
          build/ios/hayer-ios-unsigned.zip

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: hayer-ios-unsigned-${{ github.sha }}
          path: app/build/ios/hayer-ios-unsigned.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
