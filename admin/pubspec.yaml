name: hayer_admin
description: Hayer's protected POI catalog operations dashboard.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  hayer_client:
    path: ../backend/hayer_client
  intl: ^0.20.2
  maplibre_gl: ^0.27.0
  material_3_expressive: ^1.1.1
  material_ui: ^1.1.0
  motor: ^1.1.0
  passkeys: ^2.22.3
  serverpod_auth_idp_client: 4.0.0
  serverpod_auth_idp_flutter: 4.0.0
  serverpod_flutter: 4.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
