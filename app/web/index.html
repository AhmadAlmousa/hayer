<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hayer helps you swipe through places and decide together.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hayer — Decide together">
  <meta property="og:description" content="Swipe through nearby places and find the choice your group agrees on.">
  <meta property="og:url" content="https://hayer.almou.sa/">
  <meta property="og:image" content="https://hayer.almou.sa/app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAFDFC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101414" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hayer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hayer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #FAFDFC;
      overscroll-behavior-x: none;
    }
    flt-glass-pane, flutter-view { overscroll-behavior: none; }
    #hayer-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 20px;
      color: #063B3B;
      font: 700 18px system-ui, sans-serif;
      background: #FAFDFC;
      z-index: 9999;
      transition: opacity 180ms ease;
    }
    #hayer-loading img { width: 88px; height: 88px; border-radius: 26px; }
    #hayer-loading progress { width: 160px; accent-color: #0E9594; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #101414; }
    }
  </style>
</head>
<body>
  <div id="hayer-loading" role="status" aria-label="Loading Hayer">
    <img src="icons/Icon-192.png" alt="">
    <span>Hayer</span>
    <progress></progress>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const loading = document.getElementById('hayer-loading');
      if (!loading) return;
      loading.style.opacity = '0';
      window.setTimeout(() => loading.remove(), 200);
    });
    // Keep horizontal trackpad/edge gestures inside Hayer instead of letting
    // the browser interpret them as Back or Forward navigation.
    document.addEventListener('wheel', (event) => {
      if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) event.preventDefault();
    }, { passive: false });

    let edgeTouch = false;
    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', (event) => {
      const touch = event.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      edgeTouch = touchStartX < 24 || touchStartX > window.innerWidth - 24;
    }, { passive: true });
    document.addEventListener('touchmove', (event) => {
      if (!edgeTouch) return;
      const touch = event.touches[0];
      if (Math.abs(touch.clientX - touchStartX) > Math.abs(touch.clientY - touchStartY)) {
        event.preventDefault();
      }
    }, { passive: false });
    document.addEventListener('touchend', () => { edgeTouch = false; }, { passive: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
