name: hayer_app
description: Hayer's Android-first place decision application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  drift: ^2.28.2
  drift_flutter: ^0.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  go_router: ^18.0.0
  hayer_client:
    path: ../backend/hayer_client
  intl: ^0.20.2
  material_3_expressive: ^1.1.1
  material_ui: ^1.1.0
  mobile_scanner: ^7.1.3
  motor: ^1.1.0
  package_info_plus: ^9.0.1
  qr_flutter: ^4.1.0
  serverpod_auth_idp_flutter: 3.4.13
  serverpod_flutter: 3.4.13
  share_plus: ^12.0.0
  url_launcher: ^6.3.2
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.28.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config.json
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
