name: hayer_app
description: Hayer's Android-first place decision application.
publish_to: none
version: 0.2.1+7

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  calendar_view: 2.0.0
  cupertino_icons: ^1.0.9
  cupertino_ui: ^1.1.1
  drift: ^2.33.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_card_swiper: ^7.2.0
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  gcc_currency: ^0.0.1
  go_router: ^18.0.0
  hayer_client:
    path: ../backend/hayer_client
  intl: ^0.20.2
  material_ui: ^1.4.0
  maplibre_gl: ^0.27.0
  package_info_plus: ^10.2.1
  qr_flutter: ^4.1.0
  serverpod_auth_idp_flutter: 4.0.0
  serverpod_flutter: 4.0.0
  share_plus: ^13.3.0
  timelines_plus: ^2.0.1
  url_launcher: ^6.3.2
  vibration: ^3.2.1

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.33.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/branding/hayer_icon.png
    - assets/branding/hayer_icon_foreground.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/hayer_icon.png
  min_sdk_android: 21
  # The brand plate the adaptive foreground sits on. A white plate behind art
  # that carries its own margin is what put a white edge around the icon.
  adaptive_icon_background: "#0E9594"
  # Rendered by scripts/render-icons.sh: the art alone, already centred in
  # Android's safe zone, so no further inset is wanted here.
  adaptive_icon_foreground: assets/branding/hayer_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  # hayer_icon.png is opaque edge to edge, so this strips nothing.
  remove_alpha_ios: true
  background_color_ios: "#0E9594"
  web:
    generate: true
    image_path: assets/branding/hayer_icon.png
    background_color: "#0E9594"
    theme_color: "#0E9594"
  windows:
    generate: true
    image_path: assets/branding/hayer_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/hayer_icon.png
