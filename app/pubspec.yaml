name: hayer_app
description: Hayer's Android-first place decision application.
publish_to: none
version: 0.1.0+5

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  cached_network_image: ^3.4.1
  calendar_view: 2.0.0
  drift: ^2.28.2
  drift_flutter: ^0.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_card_swiper: ^7.2.0
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  gcc_currency: ^0.0.1
  go_router: ^18.0.0
  hayer_client:
    path: ../backend/hayer_client
  intl: ^0.20.2
  material_3_expressive: ^1.1.1
  material_ui: ^1.1.1
  maplibre_gl: ^0.27.0
  package_info_plus: ^9.0.1
  qr_flutter: ^4.1.0
  serverpod_auth_idp_flutter: 3.4.13
  serverpod_flutter: 3.4.13
  share_plus: ^12.0.0
  url_launcher: ^6.3.2
  vibration: ^3.2.1

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.28.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/branding/hayer_icon.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/hayer_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/hayer_icon.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: assets/branding/hayer_icon.png
    background_color: "#0E9594"
    theme_color: "#0E9594"
  windows:
    generate: true
    image_path: assets/branding/hayer_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/hayer_icon.png
